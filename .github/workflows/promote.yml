# Promote develop to main by pull request (operator, 2026-10-18).
#
# Nothing pushes main: work lands on develop, and when the `ci` workflow
# finishes GREEN on a push to develop this opens a develop -> main PR -- or,
# when one is already open, leaves it (a push to develop already updated it).
# Merging stays a human decision on GitHub; use a merge commit, not squash,
# or develop and main stop sharing history.
#
# Only the green commit that is STILL develop's tip promotes: when develop
# moved during the run, the newer commit's own ci run decides.
#
# A PR opened with GITHUB_TOKEN triggers no pull_request workflows; the checks
# GitHub shows on it are the push run's, attached to the same head commit.
# Requires the repository setting "Allow GitHub Actions to create and approve
# pull requests". workflow_run fires only from the default branch's copy of
# this file.
name: promote

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open develop -> main PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$REPO/branches/develop" -q .commit.sha)
          if [ "$tip" != "$SHA" ]; then
            echo "develop moved past ${SHA:0:9} (now ${tip:0:9}); its own ci run decides"
            exit 0
          fi
          ahead=$(gh api "repos/$REPO/compare/main...develop" -q .ahead_by)
          if [ "$ahead" = 0 ]; then
            echo "develop has nothing main lacks"
            exit 0
          fi
          open=$(gh api "repos/$REPO/pulls?state=open&base=main&head=${REPO%%/*}:develop" -q 'map(.html_url) | join(" ")')
          if [ -n "$open" ]; then
            echo "already open: $open (now at ${SHA:0:9}, green)"
            exit 0
          fi
          body=$(printf 'develop is green at %s (%s commit(s) ahead of main).\n\nci run: %s\n\nOpened by the promote workflow. Merge with a merge commit, not squash.' "${SHA:0:12}" "$ahead" "$RUN_URL")
          gh api -X POST "repos/$REPO/pulls" -f base=main -f head=develop \
            -f title="develop -> main ($(date -u +%F), ${SHA:0:9})" -f body="$body" -q .html_url
