# Tell gorge to rebuild its docs site when this repository's docs change.
#
# The compliance docs live here, next to the code they describe, and gorge's
# GitHub Pages site publishes them (docs/engines/ is the "Bring your engine"
# section). A push to main that touches docs/ sends a repository_dispatch,
# event type `docs-compliance`, to adams-shaun/gorge so its docs workflow
# rebuilds and picks the new pages up.
#
# Needs the repository secret GORGE_DISPATCH_TOKEN: a token that may create
# repository_dispatch events on adams-shaun/gorge (a fine-grained PAT with
# Contents: read and write on that repository). The token only travels in the
# Authorization header; it is never echoed, and GitHub masks it in logs.
# gorge's docs workflow must list `repository_dispatch: types: [docs-compliance]`
# among its triggers for the event to start a build.
name: docs-dispatch

on:
  push:
    branches: [main]
    paths:
      - docs/**

permissions:
  contents: read

concurrency:
  group: docs-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GORGE_DISPATCH_TOKEN: ${{ secrets.GORGE_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch docs-compliance to adams-shaun/gorge
        run: |
          if [ -z "$GORGE_DISPATCH_TOKEN" ]; then
            echo "::error::secret GORGE_DISPATCH_TOKEN is not set; gorge's docs site will not rebuild"
            exit 1
          fi
          # -f fails on a non-2xx status (GitHub answers 204 on success);
          # the request body carries the commit so the gorge run is traceable.
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GORGE_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/adams-shaun/gorge/dispatches \
            -d "{\"event_type\":\"docs-compliance\",\"client_payload\":{\"repository\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${GITHUB_SHA}\"}}"
          echo "dispatched docs-compliance for ${GITHUB_SHA}"
