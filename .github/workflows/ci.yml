# CI for gorge-compliance: the compliance oracles and scenario audits that
# back gorge's rules engine, measured against a PINNED gorge (docs/PINNING.md).
#
# Every job checks gorge out as a SIBLING directory at the pin, because the
# Forge corpus is fetched by gorge's own `make fetch-cards compile-cards` at
# gorge's FORGE_REF (the Go code itself resolves from go.mod's pinned require):
#
#   $GITHUB_WORKSPACE/gorge-compliance   this repository
#   $GITHUB_WORKSPACE/gorge              adams-shaun/gorge at the pin (or main)
#
# The pin is GORGE_PIN. A workflow_dispatch can override the gorge ref.
#
# The corpus (GPL-3.0, never committed in either repository) is cached by its
# pin and symlinked as gorge-compliance/.cards. A run with no corpus would SKIP
# every corpus test and read green, so the job fails instead.
#
# Jobs:
#   lint, test   push/PR/nightly, against the PIN. Required (ci-ok).
#   compliance   `make compliance-status` against the pin, over every set, where
#                TestCertificationRatchet covers only Standard and the declared
#                sets. Required (ci-ok) on a PR to main. Nightly and dispatch also
#                publish the per-set data the docs site renders.
#   nightly-alert  nightly on main: one GitHub issue tracks a failing night.
#   drift        nightly/dispatch: the tests against gorge MAIN. Reports what a
#                pin bump would change; never fails the workflow.
name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:
    inputs:
      gorge_ref:
        description: gorge ref to use instead of GORGE_PIN (default the pin)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -p=4
  GOWORK: 'off'

jobs:
  pin:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          pin=$(head -n1 GORGE_PIN | awk '{print $1}')
          ref='${{ inputs.gorge_ref }}'
          [ -n "$ref" ] || ref=$pin
          echo "gorge ref: $ref (GORGE_PIN: $(head -n1 GORGE_PIN))"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  lint:
    needs: pin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: gorge-compliance
      - uses: actions/checkout@v4
        with:
          repository: adams-shaun/gorge
          ref: ${{ needs.pin.outputs.ref }}
          path: gorge
      - uses: actions/setup-go@v5
        with:
          go-version-file: gorge-compliance/go.mod
          cache: false
      - name: gofmt
        working-directory: gorge-compliance
        run: |
          out=$(gofmt -l $(find . -name .git -prune -o -type f -name '*.go' -print))
          if [ -n "$out" ]; then echo "gofmt: files need formatting:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: gorge-compliance
        run: go vet ./...
      - name: shell syntax
        working-directory: gorge-compliance
        run: for f in $(git ls-files '*.sh'); do bash -n "$f" || exit 1; done

  test:
    needs: pin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: gorge-compliance
      - uses: actions/checkout@v4
        with:
          repository: adams-shaun/gorge
          ref: ${{ needs.pin.outputs.ref }}
          path: gorge
      - uses: actions/setup-go@v5
        with:
          go-version-file: gorge-compliance/go.mod
          cache: false
      - name: Read the corpus pin
        id: cpin
        run: echo "forge_ref=$(awk '/^FORGE_REF/ {print $3}' gorge/Makefile)" >> "$GITHUB_OUTPUT"
      - name: Restore the corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: gorge/.cards
          key: cards-${{ steps.cpin.outputs.forge_ref }}-${{ hashFiles('gorge/engine/cards/**/*.go') }}
          restore-keys: cards-${{ steps.cpin.outputs.forge_ref }}-
      - name: Fetch and compile the corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        working-directory: gorge
        run: make fetch-cards compile-cards
      - name: Refuse to run without the corpus, then link it
        run: |
          test -s gorge/.cards/cards.lock || { echo "no .cards corpus: every corpus test would skip"; exit 1; }
          grep -q "${{ steps.cpin.outputs.forge_ref }}" gorge/.cards/cards.lock || { echo ".cards is not at FORGE_REF"; cat gorge/.cards/cards.lock; exit 1; }
          ln -sfn ../gorge/.cards gorge-compliance/.cards
      - name: Fetch the mtgish data (sha256-checked; TestMtgishLedger skips without it)
        working-directory: gorge-compliance
        run: make mtgish-fetch
      - name: Save the corpus
        if: github.event_name != 'pull_request' && steps.corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: gorge/.cards
          key: cards-${{ steps.cpin.outputs.forge_ref }}-${{ hashFiles('gorge/engine/cards/**/*.go') }}
      - name: Licence guards (no Forge content is committed)
        working-directory: gorge-compliance
        run: go test -count=1 -timeout 5m ./internal/boundary/
      - name: Scenario audits (hand Oracle-text audit + XMage ports)
        working-directory: gorge-compliance
        run: go test -count=1 -timeout 15m ./audit/
      - name: go test
        working-directory: gorge-compliance
        run: |
          count=
          if [ "${{ github.event_name }}" = schedule ]; then count=-count=1; fi
          go test $count -timeout 30m ./...
      - name: Script smokes (stubs only)
        working-directory: gorge-compliance
        run: make smoke

  compliance:
    needs: pin
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-24.04
    # Writes the docs-data branch (below); everything else here only reads, so
    # the checkouts leave no token on disk for a pull request's code to find.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: gorge-compliance
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: adams-shaun/gorge
          ref: ${{ needs.pin.outputs.ref }}
          path: gorge
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: gorge-compliance/go.mod
          cache: false
      - name: Read the corpus pin
        id: cpin
        run: echo "forge_ref=$(awk '/^FORGE_REF/ {print $3}' gorge/Makefile)" >> "$GITHUB_OUTPUT"
      - name: Restore the corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: gorge/.cards
          key: cards-${{ steps.cpin.outputs.forge_ref }}-${{ hashFiles('gorge/engine/cards/**/*.go') }}
          restore-keys: cards-${{ steps.cpin.outputs.forge_ref }}-
      - name: Fetch and compile the corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        working-directory: gorge
        run: make fetch-cards compile-cards
      - name: Refuse to run without the corpus, then link it
        run: |
          test -s gorge/.cards/cards.lock || { echo "no .cards corpus: every corpus test would skip"; exit 1; }
          grep -q "${{ steps.cpin.outputs.forge_ref }}" gorge/.cards/cards.lock || { echo ".cards is not at FORGE_REF"; cat gorge/.cards/cards.lock; exit 1; }
          ln -sfn ../gorge/.cards gorge-compliance/.cards
      # gorge's docs site renders its per-set support table from these files
      # (gorge docs.yml fetches the docs-data branch, scripts/docs_sets.py
      # renders it). Level A covers every committed set; Level B only the
      # sets with a printed card list, which are the ones it is defined for.
      #
      # oraclediff exits 3 when a ratchet failed over a complete measurement
      # (it takes a built binary to see that: `go run` reports every failure as
      # 1). That data publishes with the failures counted in meta.json, and the
      # ratchet step below ends the job red. Any other failure publishes nothing.
      - name: Per-set status for the docs site
        if: github.event_name != 'pull_request'
        working-directory: gorge-compliance
        shell: bash
        run: |
          mkdir -p ../docs-data
          go build -trimpath -o ../oraclediff ./cmd/oraclediff
          measure() {
            local rc=0
            ../oraclediff status -all -json -procs 4 "$@" 2>> ../measure.err || rc=$?
            [ "$rc" = 0 ] || [ "$rc" = 3 ] || { cat ../measure.err; exit "$rc"; }
          }
          measure -level A > ../docs-data/status-A.jsonl
          sets=$(python3 -c 'import json,sys; print(",".join(r["set"] for r in map(json.loads, open(sys.argv[1])) if r.get("printed")))' ../docs-data/status-A.jsonl)
          measure -level B -sets "$sets" > ../docs-data/status-B.jsonl
          cat ../measure.err
          failures=$(grep -c '^RATCHET FAIL' ../measure.err || true)
          cat > ../docs-data/meta.json <<EOF
          {"commit": "$(git rev-parse --short=9 HEAD)", "gorge_pin": "$(cat GORGE_PIN)", "forge_ref": "${{ steps.cpin.outputs.forge_ref }}", "date": "$(date -u +%F)", "ratchet_failures": $failures}
          EOF
      # One force-pushed commit on an orphan branch: the data's history is not
      # worth keeping, only its latest state.
      - name: Publish the docs-data branch
        id: publish
        if: github.ref == 'refs/heads/main'
        working-directory: docs-data
        run: |
          git init -q -b docs-data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add status-A.jsonl status-B.jsonl meta.json
          git commit -q -m "docs-data: compliance status $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" docs-data:docs-data
      - name: Compliance status and ratchet
        working-directory: gorge-compliance
        shell: bash
        run: make compliance-status 2>&1 | tee ../compliance-status.log
      - name: Upload the status page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-status
          path: gorge-compliance/oracle/compliance/status.md
          if-no-files-found: ignore
      - name: Say why in the run summary
        if: failure()
        run: |
          {
            echo "## Compliance failed at gorge ${{ needs.pin.outputs.ref }}"
            echo "docs-data publish: ${{ steps.publish.outcome }}"
            echo '```'
            grep -E '^RATCHET FAIL|^oraclediff:' compliance-status.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # One issue tracks a failing nightly: opened or commented on when a night fails,
  # closed by the next green one. A cancelled or skipped night changes nothing.
  nightly-alert:
    if: always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    needs: [lint, test, compliance]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Nightly CI is failing on main
      RESULTS: lint=${{ needs.lint.result }} test=${{ needs.test.result }} compliance=${{ needs.compliance.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq 'map(select(.title == env.TITLE))[0].number // empty')
          case "$RESULTS" in
            *=failure*)
              if [ -n "$number" ]; then
                gh issue comment "$number" --body "Failed again: $RESULTS, $RUN_URL"
              else
                gh issue create --title "$TITLE" --body "$RESULTS, $RUN_URL"
              fi
              ;;
            *=cancelled*|*=skipped*) ;;
            *)
              if [ -n "$number" ]; then
                gh issue close "$number" --comment "Green again: $RUN_URL"
              fi
              ;;
          esac

  # Against gorge MAIN, not the pin: what a pin bump would change. Every
  # check is continue-on-error and lands in the job summary; the job itself
  # never fails the workflow (docs/PINNING.md, "Drift reporting").
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      GOWORK: ''
    steps:
      - uses: actions/checkout@v4
        with:
          path: gorge-compliance
      - uses: actions/checkout@v4
        with:
          repository: adams-shaun/gorge
          ref: main
          path: gorge
      - uses: actions/setup-go@v5
        with:
          go-version-file: gorge-compliance/go.mod
          cache: false
      - name: Read the corpus pin
        id: cpin
        run: echo "forge_ref=$(awk '/^FORGE_REF/ {print $3}' gorge/Makefile)" >> "$GITHUB_OUTPUT"
      - name: Restore the corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: gorge/.cards
          key: cards-${{ steps.cpin.outputs.forge_ref }}-${{ hashFiles('gorge/engine/cards/**/*.go') }}
          restore-keys: cards-${{ steps.cpin.outputs.forge_ref }}-
      - name: Fetch and compile the corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        working-directory: gorge
        run: make fetch-cards compile-cards
      - name: Refuse to run without the corpus, then link it
        run: |
          test -s gorge/.cards/cards.lock || { echo "no .cards corpus: every corpus test would skip"; exit 1; }
          grep -q "${{ steps.cpin.outputs.forge_ref }}" gorge/.cards/cards.lock || { echo ".cards is not at FORGE_REF"; cat gorge/.cards/cards.lock; exit 1; }
          ln -sfn ../gorge/.cards gorge-compliance/.cards
      - name: Build against gorge main (a go.work overrides the pin)
        working-directory: gorge-compliance
        run: go work init . ../gorge && go build ./... && go vet ./...
      - name: Tests against gorge main
        id: tests
        continue-on-error: true
        working-directory: gorge-compliance
        shell: bash
        run: go test -count=1 -timeout 40m ./... 2>&1 | tee ../drift-test.log
      - name: Compliance status against gorge main
        id: status
        continue-on-error: true
        working-directory: gorge-compliance
        shell: bash
        run: make compliance-status 2>&1 | tee ../drift-status.log
      - name: Report
        if: always()
        run: |
          {
            echo "## Drift vs gorge main ($(git -C gorge rev-parse --short=12 HEAD); pin: $(head -n1 gorge-compliance/GORGE_PIN))"
            echo "- tests: ${{ steps.tests.outcome }}"
            echo "- compliance-status: ${{ steps.status.outcome }}"
            echo
            echo '### Failing tests'
            echo '```'
            grep -E '^(--- FAIL|FAIL|ok )' drift-test.log | grep -v '^ok ' | head -200 || true
            echo '```'
            echo '### Compliance ratchet'
            echo '```'
            grep -E '^RATCHET FAIL|^ratchet:' drift-status.log || true
            echo '```'
            echo '### Stale ratchet rows'
            echo '```'
            grep -E 'stale (known|unconsumed)|known_bug row is stale' drift-test.log | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload drift logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift
          path: |
            drift-test.log
            drift-status.log
            gorge-compliance/oracle/compliance/status.md
          if-no-files-found: ignore

  # One required check to name in branch protection.
  ci-ok:
    if: always()
    needs: [lint, test, compliance]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.test.result }}" = success ] && { [ "${{ needs.compliance.result }}" = success ] || [ "${{ needs.compliance.result }}" = skipped ]; } || { echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} compliance=${{ needs.compliance.result }}"; exit 1; }
